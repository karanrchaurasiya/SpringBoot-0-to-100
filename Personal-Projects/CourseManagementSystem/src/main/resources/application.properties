spring.application.name=CourseManagementSystem

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/coursesdb?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root123

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# Execute schema.sql and data.sql after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true

# Always run data.sql
spring.sql.init.mode=always

# Show SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
